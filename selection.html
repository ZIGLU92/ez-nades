<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirage - Nades CS2</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

    <header class="header">
      <button class="burger" type="button" aria-label="Ouvrir le menu"
          aria-expanded="false" aria-controls="menu-principal">
        <span></span><span></span><span></span>
      </button>
    <a href="index.html" class="header__logo">
      <img src="img/logo/logo.png" alt="Logo">
    </a>
    <nav class="header__nav" id="menu-principal">
      <a href="#">Nades favorites</a>
      <a href="#">Tutoriels</a>
      <a href="#nade-du-jour">Nade du jour</a>
      <a href="contact.html">Contactez-nous</a>
    </nav>
    <div class="header__actions">
      <a href="connexion.html" class="btn">S'identifier</a>
      </div>
  </header>

  <main>
    <section class="map-hero">
      <h1 class="map-hero__titre">Mirage</h1>
    </section>

    <div class="niveau">
      <select class="niveau__select" aria-label="Niveau">
        <option>Niveau 1</option>
        <option disabled>Niveau 2 (bientôt)</option>
      </select>
    </div>

    <div class="filtres">
      <span class="filtres__titre">Filtres :</span>
      <select class="filtres__select" aria-label="Type de nade">
       <option value="" selected disabled hidden>Type de nade</option>
       <option value="smoke">Smoke</option>
      </select>

      <select class="filtres__select" aria-label="Équipe">
       <option value="" selected disabled hidden>Équipe</option>
       <option value="t">T</option>
       <option value="ct">CT</option>
      </select>
      
      <details class="lancer">
        <summary class="lancer__titre">Type de lancer</summary>
        <div class="lancer__panneau">

         <div class="interrupteur-ligne">
          <span>Avec jumpthrow</span>
          <label class="interrupteur">
           <input type="checkbox" name="jumpthrow" aria-label="Sans jumpthrow">
           <span class="interrupteur__piste"></span>
           </label>
          <span>Sans jumpthrow</span>
          </div>

         <div class="interrupteur-ligne">
          <span>Avec runthrow</span>
          <label class="interrupteur">
           <input type="checkbox" name="runthrow" aria-label="Sans runthrow">
           <span class="interrupteur__piste"></span>
           </label>
          <span>Sans runthrow</span>
          </div>

         </div>
        </details>
     </div>

    <section class="smokes">
      <a href="apprendre-site-a-stairs.html" class="smoke-carte">
        <img src="img/smokes/site-a-stairs.jpg" alt="Smoke Site A Stairs sur Mirage" class="smoke-carte__image">
        <h2 class="smoke-carte__nom">Site A - Stairs</h2>
        <span class="smoke-carte__badge">
          <img src="img/pictos/smoke-blanc.png" alt="" class="smoke-carte__picto">
          Smoke
        </span>
      </a>

      <a href="apprendre-mid-window.html" class="smoke-carte">
        <img src="img/smokes/mid-window.jpg" alt="Smoke Mid Window sur Mirage" class="smoke-carte__image">
        <h2 class="smoke-carte__nom">Mid - Window</h2>
        <span class="smoke-carte__badge">
          <img src="img/pictos/smoke-blanc.png" alt="" class="smoke-carte__picto">
          Smoke
        </span>
      </a>
    
      <a href="apprendre-site-b-market.html" class="smoke-carte">
        <img src="img/smokes/site-b-market.jpg" alt="Smoke Site B Market sur Mirage" class="smoke-carte__image">
        <h2 class="smoke-carte__nom">Site B - Market</h2>
        <span class="smoke-carte__badge">
          <img src="img/pictos/smoke-blanc.png" alt="" class="smoke-carte__picto">
          Smoke
        </span>
      </a>
     
    </section>

    <section class="nade-du-jour" id="nade-du-jour">
      <h2>Nade du jour</h2>
    </section>
  </main>

</body>
</html>
