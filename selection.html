<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirage - Nades CS2</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

    <header class="header">
      <button class="burger" type="button" aria-label="Ouvrir le menu"
          aria-expanded="false" aria-controls="menu-principal">
        <span></span><span></span><span></span>
      </button>
    <a href="index.html" class="header__logo">
      <img src="img/logo/logo.png" alt="Logo">
    </a>
    <nav class="header__nav" id="menu-principal">
      <a href="#">Nades favorites</a>
      <a href="#">Tutoriels</a>
      <a href="#nade-du-jour">Nade du jour</a>
      <a href="contact.html">Contactez-nous</a>
    </nav>
    <div class="header__actions">
      <a href="connexion.html" class="btn">S'identifier</a>
      </div>
  </header>

  <main>
    <section class="map-hero">
      <h1 class="map-hero__titre">Mirage</h1>
    </section>

    <section class="bloc-niveau" data-progression="mirage" data-total="3">
  <h2 class="bloc-niveau__titre">Niveau 1</h2>

  <div class="bloc-niveau__progression">
    <div class="barre barre--niveau">
      <div class="barre__remplie" style="width: 0%"></div>
    </div>
    <span class="barre__pourcent">0%</span>
  </div>

  <ul class="bloc-niveau__liste">
    <li>
      <label class="option">
        <input type="checkbox" class="case" disabled data-nade="mirage-site-a-stairs">
        <span>Stairs</span>
      </label>
    </li>
    <li>
      <label class="option">
        <input type="checkbox" class="case" disabled data-nade="mirage-mid-window">
        <span>Window</span>
      </label>
    </li>
    <li>
      <label class="option">
        <input type="checkbox" class="case" disabled data-nade="mirage-site-b-market">
        <span>Market</span>
      </label>
    </li>
  </ul>
</section>

<div class="selection">

  <aside class="menu-filtres" aria-label="Filtres">
    <div class="menu-filtres__entete">
      <h2 class="menu-filtres__titre">Filtres :</h2>
      <div class="menu-filtres__onglets">
        <button type="button" class="menu-filtres__onglet" aria-expanded="false" aria-controls="filtre-types">Type de nade</button>
        <button type="button" class="menu-filtres__onglet" aria-expanded="false" aria-controls="filtre-equipe">Équipe</button>
        <button type="button" class="menu-filtres__onglet" aria-expanded="false" aria-controls="filtre-lancer">Type de lancer</button>
      </div>
    </div>

    <div class="menu-filtres__groupes">

      <fieldset class="groupe-filtre" id="filtre-types">
        <legend class="groupe-filtre__titre">Types de nade :</legend>
        <div class="groupe-filtre__options">
          <label class="option"><input type="checkbox" class="case" name="type" value="smoke" checked><span>Smoke</span></label>
          <label class="option"><input type="checkbox" class="case" name="type" value="molotov" checked><span>Molotov</span></label>
          <label class="option"><input type="checkbox" class="case" name="type" value="flash" checked><span>Flash</span></label>
          <label class="option"><input type="checkbox" class="case" name="type" value="explosif" checked><span>Explosif</span></label>
        </div>
      </fieldset>

      <fieldset class="groupe-filtre" id="filtre-equipe">
        <legend class="groupe-filtre__titre">Équipe :</legend>
        <div class="groupe-filtre__options">
          <label class="option"><input type="checkbox" class="case" name="equipe" value="ct" checked><span>CT</span></label>
          <label class="option"><input type="checkbox" class="case" name="equipe" value="t" checked><span>T</span></label>
        </div>
      </fieldset>

      <fieldset class="groupe-filtre" id="filtre-lancer">
        <legend class="groupe-filtre__titre">Type de lancer :</legend>
        <div class="groupe-filtre__options">
          <label class="option"><input type="checkbox" class="case" name="exclure" value="jumpthrow"><span>Exclure jumpthrow</span></label>
          <label class="option"><input type="checkbox" class="case" name="exclure" value="runthrow"><span>Exclure runthrow</span></label>
        </div>
      </fieldset>

    </div>
  </aside>

  <section class="smokes">
      <a href="apprendre-site-a-stairs.html" class="smoke-carte">
        <img src="img/smokes/site-a-stairs.jpg" alt="Smoke Site A Stairs sur Mirage" class="smoke-carte__image">
        <h2 class="smoke-carte__nom">Site A - Stairs</h2>
        <span class="smoke-carte__badge">
          <img src="img/pictos/smoke-beige.png" alt="" class="smoke-carte__picto">
          Smoke
        </span>
      </a>

      <a href="apprendre-mid-window.html" class="smoke-carte">
        <img src="img/smokes/mid-window.jpg" alt="Smoke Mid Window sur Mirage" class="smoke-carte__image">
        <h2 class="smoke-carte__nom">Mid - Window</h2>
        <span class="smoke-carte__badge">
          <img src="img/pictos/smoke-beige.png" alt="" class="smoke-carte__picto">
          Smoke
        </span>
      </a>
    
      <a href="apprendre-site-b-market.html" class="smoke-carte">
        <img src="img/smokes/site-b-market.jpg" alt="Smoke Site B Market sur Mirage" class="smoke-carte__image">
        <h2 class="smoke-carte__nom">Site B - Market</h2>
        <span class="smoke-carte__badge">
          <img src="img/pictos/smoke-beige.png" alt="" class="smoke-carte__picto">
          Smoke
        </span>
      </a>
     
    </section>

</div>
  </main>

</body>
</html>
