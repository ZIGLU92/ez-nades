<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Nades CS2</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header header--sans-actions">
    <a href="index.html" class="header__logo">
      <img src="img/logo/logo.png" alt="Logo">
    </a>
    <nav class="header__nav">
      <a href="#">Nades favorites</a>
      <a href="#">Tutoriels</a>
      <a href="index.html#nade-du-jour">Nade du jour</a>
      <a href="contact.html">Contactez-nous</a>
    </nav>
  </header>

  <main class="page-carte">
    <section class="login">
      <h1 class="login__titre">Bienvenue sur</h1>
      <img src="img/logo/logo.png" alt="EZ nades" class="login__logo">
      <p class="login__texte">
        Rejoignez-nous pour apprendre dès maintenant vos premières nades
        et accéder à des fonctionnalités exclusives
      </p>

      <div class="login__boutons">
        <button type="button" class="login__bouton">
          <img src="img/icones/google.svg" alt="" class="login__icone">
          <span>Continuer avec Google</span>
        </button>
        <button type="button" class="login__bouton">
          <img src="img/icones/apple.svg" alt="" class="login__icone">
          <span>Continuer avec Apple</span>
        </button>
        <button type="button" class="login__bouton">
          <img src="img/icones/email.svg" alt="" class="login__icone">
          <span>Continuer avec l'e-mail</span>
        </button>
        <button type="button" class="login__bouton login__bouton--steam">
          <img src="img/icones/steam.svg" alt="" class="login__icone">
          <span>Continuer avec Steam</span>
        </button>
      </div>
    </section>
  </main>

</body>
</html>
